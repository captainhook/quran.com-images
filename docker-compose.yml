services:
  mysql:
    image: mysql:8
    environment:
      - MYSQL_DATABASE=nextgen
      - MYSQL_USER=nextgen
      - MYSQL_PASSWORD=nextgen
      - MYSQL_ROOT_PASSWORD=nextgen
    volumes:
      - mysqldata:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  gen:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./output:/app/output

volumes:
  mysqldata:
    driver: local
